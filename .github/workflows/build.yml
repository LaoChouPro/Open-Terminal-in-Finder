name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate scripts and property lists
        run: |
          bash -n Scripts/build.sh Scripts/install.sh
          plutil -lint FinderTerminal/Info.plist \
            FinderTerminalExtension/Info.plist \
            FinderTerminalExtension/FinderTerminalExtension.entitlements
          git diff --check

      - name: Build app and FinderSync extension
        run: ./Scripts/build.sh

      - name: Verify app bundle
        run: |
          test -x build/FinderTerminal.app/Contents/MacOS/FinderTerminal
          test -x build/FinderTerminal.app/Contents/PlugIns/FinderTerminalExtension.appex/Contents/MacOS/FinderTerminalExtension
          test -f build/FinderTerminal.app/Contents/Resources/AppIcon.icns
          codesign --verify --deep --strict --verbose=2 build/FinderTerminal.app
